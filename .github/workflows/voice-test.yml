# Narrates a short narrator voice test (an episode with "kind": "voice-test")
# with ElevenLabs, checks the take, and makes the audio downloadable,
# including on iPhone. Voice tests skip the 60-90 s episode rule (they allow
# 5-30 s and at most 400 characters); every other check still applies,
# including script approval.
#
# Credits: nothing is sent to ElevenLabs unless "Generate the narration" is
# ticked. Each such run spends about 1 credit per character of the script
# (the plan step shows the count first). Run by hand only.
#
# Reusing a take (no credits): enter the run id of an earlier Voice test run
# (the number in its URL, .../actions/runs/<id>) in "Reuse the take of run".
# Its MP3 is taken from that run's artifact (kept 30 days) and prepared,
# checked and published exactly like a new take, without contacting
# ElevenLabs. Use it when a run paid for a take but failed afterwards.
#
# Uses the ELEVENLABS_API_KEY repository secret. Narrator: Madame Scientia,
# unless the ELEVENLABS_VOICE_ID variable says otherwise.
name: Voice test

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Voice test id (folder in tiktok/episodes with kind voice-test)"
        required: true
        default: voice-test
        type: string
      spend_credits:
        description: "Generate the narration (spends about 1 ElevenLabs credit per character)"
        required: true
        default: false
        type: boolean
      reuse_run:
        description: "Or reuse the take of run (id of an earlier Voice test run; no credits). Leave empty otherwise"
        required: false
        default: ""
        type: string
      preview_video:
        description: "Also render a short TEST video with subtitles to check the timing"
        required: true
        default: true
        type: boolean
      publish:
        description: "Attach the MP3 (and video) to the tiktok-renders pre-release for iPhone"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read # to download the artifact of an earlier run when reusing its take

concurrency:
  group: voice-test-${{ inputs.episode }}
  cancel-in-progress: false

jobs:
  voice-test:
    name: Voice test ${{ inputs.episode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EPISODE: ${{ inputs.episode }}
      REUSE_RUN: ${{ inputs.reuse_run }}
      SPEND_CREDITS: ${{ inputs.spend_credits }}
    defaults:
      run:
        working-directory: tiktok
    outputs:
      name: ${{ steps.files.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiktok/package-lock.json

      - name: Check the id
        run: |
          if [[ ! "$EPISODE" =~ ^[a-z0-9][a-z0-9-]{1,63}$ ]]; then
            echo "::error::Id must be lowercase letters, digits and hyphens: $EPISODE"
            exit 1
          fi
          if [[ ! -f "episodes/$EPISODE/episode.json" ]]; then
            echo "::error::tiktok/episodes/$EPISODE/episode.json does not exist"
            exit 1
          fi
          if [[ -n "$REUSE_RUN" ]]; then
            if [[ ! "$REUSE_RUN" =~ ^[0-9]{1,20}$ ]]; then
              echo "::error::The run to reuse must be a run id (the number in .../actions/runs/<id>): $REUSE_RUN"
              exit 1
            fi
            if [[ "$SPEND_CREDITS" == "true" ]]; then
              echo "::error::Choose one: generate a new take (spends credits) or reuse the take of run $REUSE_RUN (no credits)."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Plan (checks the script and approval; sends nothing)
        env:
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: npm run voice-test -- "$EPISODE"

      - name: Narrate with ElevenLabs (spends credits)
        if: inputs.spend_credits
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: npm run narrate -- "$EPISODE"

      - name: Download the take of run ${{ inputs.reuse_run }} (no credits)
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
          pattern: ${{ inputs.episode }}_*
          merge-multiple: true
          path: tiktok/reused

      - name: Prepare the reused take (nothing is sent to ElevenLabs)
        if: inputs.reuse_run != ''
        env:
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          shopt -s nullglob
          mp3s=(reused/*.mp3)
          takes=(reused/*.elevenlabs-take.json)
          if [[ ${#mp3s[@]} -ne 1 ]]; then
            echo "::error::Expected one MP3 in the artifact of run $REUSE_RUN, found ${#mp3s[@]}."
            exit 1
          fi
          args=(--from "GitHub Actions run $REUSE_RUN ($(basename "${mp3s[0]}"))")
          if [[ ${#takes[@]} -eq 1 ]]; then args+=(--take "${takes[0]}"); fi
          npm run narration:recover -- "$EPISODE" "${mp3s[0]}" "${args[@]}"

      - name: Check the take
        if: inputs.spend_credits || inputs.reuse_run != ''
        run: npm run voice-test -- "$EPISODE" --report

      - name: Cache Remotion's browser
        if: (inputs.spend_credits || inputs.reuse_run != '') && inputs.preview_video
        uses: actions/cache@v4
        with:
          path: tiktok/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('tiktok/package-lock.json') }}

      - name: Render a preview video (TEST badge, uses the same narration)
        if: (inputs.spend_credits || inputs.reuse_run != '') && inputs.preview_video
        run: |
          npx remotion browser ensure
          npm run render -- "$EPISODE"

      - name: Collect the files
        id: files
        if: always() && (inputs.spend_credits || inputs.reuse_run != '')
        run: |
          name="${EPISODE}_$(date -u +%Y%m%d-%H%M)_run${GITHUB_RUN_NUMBER}"
          if [[ -n "$REUSE_RUN" ]]; then name="${name}_reused"; fi
          media="public/episodes/$EPISODE"
          mkdir -p upload
          # The MP3 and ElevenLabs' timing are saved before mastering, so they
          # are kept here even when a later step failed: reuse them for free.
          if [[ -f "$media/narration.source.mp3" ]]; then cp "$media/narration.source.mp3" "upload/$name.mp3"; fi
          for file in elevenlabs-take.json alignment.json narration.json; do
            if [[ -f "$media/$file" ]]; then cp "$media/$file" "upload/$name.$file"; fi
          done
          for ext in voice-report.json mp4 report.json; do
            if [[ -f "out/$EPISODE.$ext" ]]; then cp "out/$EPISODE.$ext" "upload/$name.$ext"; fi
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the take as a run artifact
        if: always() && (inputs.spend_credits || inputs.reuse_run != '') && steps.files.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.name }}
          path: tiktok/upload/
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Publish for iPhone listening
    needs: voice-test
    if: (inputs.spend_credits || inputs.reuse_run != '') && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.voice-test.outputs.name }}
          path: upload

      - name: Attach the take to the tiktok-renders pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.voice-test.outputs.name }}
        run: |
          if ! gh release view tiktok-renders > /dev/null 2>&1; then
            gh release create tiktok-renders --prerelease --target "$GITHUB_SHA" \
              --title "TikTok renders" \
              --notes "Rendered TikTok videos and voice tests. Not software releases. On iPhone: tap a file to play it."
          fi
          files=("upload/$NAME.mp3")
          if [[ -f "upload/$NAME.mp4" ]]; then files+=("upload/$NAME.mp4"); fi
          gh release upload tiktok-renders "${files[@]}" --clobber
          {
            echo "## Listen on iPhone"
            echo ""
            echo "- [$NAME.mp3](https://github.com/$GH_REPO/releases/download/tiktok-renders/$NAME.mp3)"
            if [[ -f "upload/$NAME.mp4" ]]; then
              echo "- [$NAME.mp4](https://github.com/$GH_REPO/releases/download/tiktok-renders/$NAME.mp4) (preview with subtitles)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
